# Docker publish on GitLab (replaces local pre-push hook / unused GitHub Actions).
# Images: Docker Hub (darknetz/php-rand) + GHCR (ghcr.io/darknetzz/php-rand)
#
# Required CI/CD variables (Settings → CI/CD → Variables), preferably masked:
#   DOCKERHUB_USERNAME
#   DOCKERHUB_TOKEN          (Hub access token)
#   GITHUB_TOKEN             (GitHub PAT with write:packages for GHCR)
# Optional:
#   SKIP_DOCKERHUB=1         Hub only off
#   SKIP_GHCR=1              GHCR only off
#   GHCR_USER                defaults via docker-pushimage.sh / image path
#
# Sync: docker-pushimage.sh builds once and pushes the same tags to every
# enabled registry. Job fails if Hub or GHCR login/push fails (unless SKIP_*).
# Runner needs Docker-in-Docker (privileged) for the docker:dind service.

stages:
  - publish

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  FF_NETWORK_PER_BUILD: "true"

.docker_publish:
  stage: publish
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  before_script:
    - apk add --no-cache bash
    - until docker info >/dev/null 2>&1; do sleep 1; done
    - |
      if [[ -z "${DOCKERHUB_USERNAME:-}" || -z "${DOCKERHUB_TOKEN:-}" ]]; then
        if [[ "${SKIP_DOCKERHUB:-}" != "1" ]]; then
          echo "Set DOCKERHUB_USERNAME + DOCKERHUB_TOKEN (or SKIP_DOCKERHUB=1)." >&2
          exit 1
        fi
      fi
      if [[ -z "${GITHUB_TOKEN:-}" && "${SKIP_GHCR:-}" != "1" ]]; then
        echo "Set GITHUB_TOKEN for GHCR (or SKIP_GHCR=1)." >&2
        exit 1
      fi
  # Retry once: Hub/GHCR flakes after long builds are common.
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

docker-dev:
  extends: .docker_publish
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  script:
    - bash ./docker-pushimage.sh --dev

docker-release:
  extends: .docker_publish
  rules:
    - if: $CI_COMMIT_TAG =~ /^v?[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - bash ./docker-pushimage.sh --release "$CI_COMMIT_TAG"
